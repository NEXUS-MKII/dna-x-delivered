<!-- SITE HEADER — shared by every page. Injected by build_ghl.py between the HEADER markers;
     edit THIS file, not the copy inside index.html / pricing.html. the readout span is filled per page. -->
<style>
  .hdr{position:fixed;top:0;left:0;right:0;z-index:110;height:64px;display:flex;align-items:center;justify-content:space-between;
    padding:0 clamp(18px,3vw,40px);background:rgba(23,17,10,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(230,190,106,.14);}
  .hdr-l{display:flex;align-items:center;gap:18px;min-width:0;}
  .hdr-brand{display:inline-flex;align-items:center;gap:.4em;font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;
    text-transform:uppercase;letter-spacing:.04em;color:var(--white);text-decoration:none;white-space:nowrap;}
  .hdr-brand img{height:1.1em;width:auto;display:block;}
  .hdr-brand .q{color:var(--gold);}
  .hdr-read{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.1em;color:var(--gold);opacity:.8;white-space:nowrap;}
  .hdr-read .w{color:var(--warm);}
  .hdr-nav{display:flex;align-items:center;gap:clamp(16px,2.2vw,28px);}
  .hdr-nav a{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--silver-2);text-decoration:none;transition:color .2s;}
  .hdr-nav a:hover,.hdr-nav a.on{color:var(--gold);}
  .hdr-cta{font-family:'Oswald',sans-serif!important;font-weight:500;font-size:13px!important;letter-spacing:.08em!important;
    color:var(--gold)!important;border:1px solid rgba(230,190,106,.5);border-radius:5px;padding:8px 15px;transition:background .2s,color .2s;}
  .hdr-cta:hover{background:rgba(230,190,106,.12);}
  .hdr-burger{display:none;width:40px;height:40px;border:1px solid rgba(230,190,106,.35);border-radius:6px;background:transparent;cursor:pointer;
    align-items:center;justify-content:center;flex-direction:column;gap:5px;padding:0;}
  .hdr-burger i{display:block;width:18px;height:1.5px;background:var(--gold);transition:transform .25s,opacity .25s;}
  .hdr-burger[aria-expanded="true"] i:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
  .hdr-burger[aria-expanded="true"] i:nth-child(2){opacity:0;}
  .hdr-burger[aria-expanded="true"] i:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}
  .hdr-menu{position:fixed;inset:0;z-index:105;display:none;flex-direction:column;justify-content:center;gap:6px;padding:80px 28px 40px;
    background-color:#17110a;background-image:var(--steel-sheen),var(--steel-stripes);background-blend-mode:screen,normal;}
  .hdr-menu.open{display:flex;}
  .hdr-menu a{font-family:'Oswald',sans-serif;font-weight:600;font-size:clamp(30px,8vw,44px);text-transform:uppercase;letter-spacing:.02em;
    color:var(--white);text-decoration:none;padding:10px 0;border-bottom:1px solid rgba(230,190,106,.14);}
  .hdr-menu a.on,.hdr-menu a:hover{color:var(--gold);}
  .hdr-menu .m-cta{margin-top:22px;border:none;color:var(--gold);font-size:clamp(20px,5vw,26px);}
  .hdr-menu .m-cta::before{content:"\03C8  ";}
  body.menu-open{overflow:hidden;}
  /* the HUD's top corners sit under the bar — drop them below it */
  .hud .tl,.hud .tr{top:76px;}
  @media(max-width:860px){.hdr-nav{display:none;}.hdr-burger{display:flex;}.hdr-read{display:none;}}
  @media(max-width:640px){.hdr-brand{font-size:18px;}}
</style>
<header class="hdr" id="hdr">
  <div class="hdr-l">
    <a class="hdr-brand" href="index.html" aria-label="PsikiQ home"><img src="psi-gold.webp" alt="" aria-hidden="true"><span>Psiki<span class="q">Q</span></span></a>
    <span class="hdr-read mono">{{READOUT}}</span>
  </div>
  <nav class="hdr-nav" aria-label="Site">
    <a href="index.html#instrument">The instrument</a>
    <a href="index.html#engine">The engine</a>
    <a href="index.html#proof">Proof</a>
    <a href="pricing.html" data-nav="pricing">Pricing</a>
    <a href="#" class="hdr-cta" data-cta="quiz">Get your prognosis</a>
  </nav>
  <button class="hdr-burger" id="hdrBurger" type="button" aria-label="Menu" aria-controls="hdrMenu" aria-expanded="false"><i></i><i></i><i></i></button>
</header>
<nav class="hdr-menu" id="hdrMenu" aria-label="Site, mobile">
  <a href="index.html">Home</a>
  <a href="index.html#instrument">The instrument</a>
  <a href="index.html#engine">The engine</a>
  <a href="index.html#proof">Proof</a>
  <a href="pricing.html" data-nav="pricing">Pricing</a>
  <a href="#" class="m-cta" data-cta="quiz">Get your prognosis</a>
</nav>
<script>
(function(){
  var b=document.getElementById('hdrBurger'),m=document.getElementById('hdrMenu');
  if(!b||!m)return;
  function set(o){b.setAttribute('aria-expanded',o?'true':'false');m.classList.toggle('open',o);document.body.classList.toggle('menu-open',o);}
  b.addEventListener('click',function(){set(b.getAttribute('aria-expanded')!=='true');});
  m.addEventListener('click',function(e){if(e.target.tagName==='A')set(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')set(false);});
  /* mark the current page */
  var here=location.pathname.replace(/\/index\.html$/,'/').replace(/\.html$/,'');
  [].forEach.call(document.querySelectorAll('[data-nav]'),function(a){
    var p=a.getAttribute('href').replace(/\.html$/,'').replace(/^\//,'');
    if(here.replace(/^\//,'')===p||here.split('/').pop()===p)a.classList.add('on');
  });
})();
</script>
