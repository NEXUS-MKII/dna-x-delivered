<style>
  #psk-practice{--gold:#E6BE6A;--warm:#E8912E;--silver-2:#9AA3AD;--glow:rgba(230,190,106,.28);
    position:relative;box-sizing:border-box;padding:clamp(56px,8vw,104px) clamp(20px,6vw,88px);color:#fff;
    background-color:#17110a;
    background-image:linear-gradient(105deg,rgba(230,190,106,.10) 0%,rgba(230,190,106,.18) 12%,rgba(201,207,214,.06) 26%,transparent 42%,rgba(230,190,106,.10) 62%,transparent 84%),
      repeating-linear-gradient(90deg,#17110a 0px,#20180e 2px,#191108 4px,#241b0f 6px,#150f08 8px);
    border-top:1px solid rgba(230,190,106,.14);font-family:'Chakra Petch',system-ui,sans-serif;font-weight:400;line-height:1.55;}
  #psk-practice *{box-sizing:border-box;margin:0;padding:0;}
  #psk-practice .pr-head{text-align:center;max-width:680px;margin:0 auto 40px;}
  #psk-practice .qlabel{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500;font-size:11.5px;letter-spacing:.14em;color:var(--warm);text-transform:uppercase;margin-bottom:26px;}
  #psk-practice .pr-h{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.01em;line-height:1.0;text-transform:uppercase;font-size:clamp(26px,4.4vw,50px);color:#fff;}
  #psk-practice .pr-h .em{color:var(--gold);}
  #psk-practice .pr-sub{color:var(--silver-2);font-size:15px;margin-top:14px;line-height:1.6;}
  #psk-practice .film{position:relative;max-width:960px;margin:0 auto;border:1px solid rgba(230,190,106,.22);border-top:2px solid var(--gold);border-radius:8px;background:#0e0a06;overflow:hidden;box-shadow:0 30px 80px -30px rgba(0,0,0,.8);}
  #psk-practice .film::before{content:"\03C8 // FIELD RECORDING";position:absolute;top:14px;right:18px;z-index:3;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.12em;color:var(--gold);opacity:.7;pointer-events:none;transition:opacity .4s;}
  #psk-practice .film.playing::before{opacity:0;}
  #psk-practice video{display:block;width:100%;aspect-ratio:16/9;background:#000;}
  #psk-practice .film-play{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;background:radial-gradient(ellipse at center,rgba(23,17,10,.15),rgba(23,17,10,.55));transition:opacity .4s;}
  #psk-practice .film-play .ring{width:88px;height:88px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;background:rgba(23,17,10,.55);box-shadow:0 0 32px 2px var(--glow);transition:transform .25s,box-shadow .25s;}
  #psk-practice .film-play:hover .ring,#psk-practice .film-play:focus-visible .ring{transform:scale(1.06);box-shadow:0 0 48px 6px var(--glow);}
  #psk-practice .film-play .ring svg{width:30px;height:30px;margin-left:5px;fill:var(--gold);}
  #psk-practice .film-play .cue{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);opacity:.85;}
  #psk-practice .film.playing .film-play{opacity:0;pointer-events:none;}
  #psk-practice .film-cap{max-width:960px;margin:14px auto 0;display:flex;justify-content:space-between;gap:16px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--silver-2);opacity:.75;}
  @media(max-width:640px){#psk-practice .film-cap{flex-direction:column;gap:4px;}#psk-practice .film-play .ring{width:68px;height:68px;}}
</style>
