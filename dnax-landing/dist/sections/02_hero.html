<style>
.dnax-hero-section {
  background: var(--dnax-deep-navy);
  color: var(--dnax-text-light);
  position: relative;
  overflow: hidden;
  min-height: 70vh;
  display: flex;
  align-items: center;
}

.dnax-hero-section::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 4px);
  pointer-events: none;
}

.dnax-hero-section::after {
  content: '';
  position: absolute;
  top: -10%;
  right: -5%;
  width: 50%;
  height: 60%;
  background: radial-gradient(ellipse, rgba(232,76,30,0.12) 0%, transparent 70%);
  filter: blur(20px);
  pointer-events: none;
}

.dnax-hero-inner {
  max-width: 980px;
  margin: 0 auto;
  position: relative;
  z-index: 2;
  text-align: center;
}

.dnax-hero-eyebrow {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.28em;
  color: var(--dnax-orange);
  text-transform: uppercase;
  margin-bottom: 28px;
}

.dnax-hero-eyebrow .dnax-dna-mini {
  font-family: 'Blinker', sans-serif;
  font-weight: 800;
  font-size: 16px;
  letter-spacing: 0;
}

.dnax-hero-eyebrow .dnax-dna-mini sup {
  color: var(--dnax-white);
  font-size: 0.7em;
  margin-left: 1px;
}

.dnax-hero-section h1 {
  font-size: clamp(54px, 8vw, 92px);
  color: var(--dnax-white);
  margin-bottom: 24px;
  letter-spacing: -0.025em;
  line-height: 1;
}

.dnax-hero-section h1 .dnax-x-factor {
  color: var(--dnax-orange);
  font-style: italic;
  font-weight: 800;
}

.dnax-hero-tagline {
  font-size: 16px;
  font-style: italic;
  color: var(--dnax-text-light-dim);
  margin-bottom: 28px;
  letter-spacing: 0.02em;
}

.dnax-hero-urgency {
  font-size: clamp(15px, 1.5vw, 17px);
  color: var(--dnax-text-light);
  max-width: 580px;
  margin: 0 auto 36px;
  line-height: 1.55;
  font-weight: 500;
}

.dnax-hero-urgency strong {
  color: var(--dnax-white);
  font-weight: 700;
}

.dnax-hero-urgency .dnax-tools {
  color: var(--dnax-orange);
  font-weight: 600;
}

.dnax-hero-cta {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.dnax-hero-cta .dnax-btn {
  font-size: 16px;
  padding: 17px 32px;
}

.dnax-hero-cta-meta {
  font-size: 12px;
  color: var(--dnax-text-light-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 4px;
}

.dnax-hero-corner {
  position: absolute;
  top: 32px;
  right: 32px;
  font-family: 'Blinker', sans-serif;
  font-weight: 800;
  font-size: 28px;
  color: rgba(255,255,255,0.85);
  z-index: 3;
  letter-spacing: -0.02em;
}

.dnax-hero-corner sup {
  color: var(--dnax-orange);
  font-size: 0.7em;
}

@media (max-width: 880px) {
  .dnax-hero-corner {
    top: 18px;
    right: 18px;
    font-size: 22px;
  }
  .dnax-hero-cta .dnax-btn {
    font-size: 15px;
    padding: 15px 22px;
    white-space: normal;
    line-height: 1.3;
  }
}
</style>

<section class="dnax-section dnax-hero-section" id="hero">
  <div class="dnax-hero-corner" aria-hidden="true">
    DNA<sup>x</sup>
  </div>
  <div class="dnax-hero-inner">
    <div class="dnax-hero-eyebrow">
      <span class="dnax-dna-mini">DNA<sup>x</sup></span> &nbsp;—&nbsp; DONE NOW, AUTHENTIC.
    </div>
    <h1>Your DNA. <span class="dnax-x-factor">Your X-Factor.</span></h1>
    <p class="dnax-hero-tagline">Hand built by robots, imagined by humans.</p>
    <p class="dnax-hero-urgency">
      You could be using your <span class="dnax-tools">Brand Blueprint</span> and <span class="dnax-tools">AI Voice Encoder</span> by the end of the week.
    </p>
    <div class="dnax-hero-cta">
      <a href="#dnax-diagnostic" class="dnax-btn">Begin X-traction — power your X-Factor</a>
      <p class="dnax-hero-cta-meta">FREE DIAGNOSTIC  •  10 MINUTES  •  NO CARD REQUIRED</p>
    </div>
  </div>
</section>
